  <style>
    :root {
      --brand: #ea5846;
      --brand-dark: #d8483a;
      --bg: #000000;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, .6);
      --faint: rgba(255, 255, 255, .38);
      --line: rgba(255, 255, 255, .13);
      --surface: rgba(255, 255, 255, .045);
      --surface-2: rgba(255, 255, 255, .09);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 48px 20px;
      text-align: center;
      min-height: 100svh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection { background: rgba(234, 88, 70, .35); color: #fff; }
    a { color: inherit; text-decoration: none; }

    .logo { width: 76px; height: 76px; }

    h1 {
      font-size: clamp(40px, 7vw, 56px);
      font-weight: 700;
      letter-spacing: -.025em;
      line-height: 1.05;
    }

    .tagline {
      max-width: 480px;
      font-size: 15.5px;
      line-height: 1.65;
      color: var(--muted);
      margin-top: -10px;
    }

    .tagline b { color: var(--text); font-weight: 600; }

    .buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 4px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 50px;
      padding: 0 24px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      white-space: nowrap;
      letter-spacing: normal;
      text-shadow: none;
      transition: background .3s, color .3s, transform .35s var(--ease-out);
      will-change: transform;
    }

    .btn:active { transform: scale(.97); }

    .btn.magnetic-live {
      transition: background .3s, color .3s;
    }

    .btn svg { width: 17px; height: 17px; flex: none; }

    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-dark); }

    .btn-ghost {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--text);
    }
    .btn-ghost:hover {
      background: var(--surface-2);
      border-color: rgba(255, 255, 255, .28);
    }

    :where(a, .btn):focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 3px;
    }

    /* ---- ROLL-анимация ---- */
    .btn-label {
      display: inline-flex;
      white-space: pre;
      line-height: 1;
    }

    .roll-c {
      display: inline-block;
      height: 1.2em;
      line-height: 1.2em;
      overflow: hidden;
      vertical-align: top;
      letter-spacing: normal;
    }

    .roll-c > span {
      display: block;
      height: 1.2em;
      line-height: 1.2em;
      transition: transform .45s var(--ease-out);
      transition-delay: calc(var(--i) * 12ms);
      will-change: transform;
    }

    .btn:hover .roll-c > span { transform: translateY(-100%); }

    footer {
      font-size: 12.5px;
      color: var(--faint);
      line-height: 1.7;
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
    }
    footer a { color: rgba(255, 255, 255, .52); transition: color .18s ease; }
    footer a:hover { color: #fff; }

    @media (prefers-reduced-motion: reduce) {
      .btn, .roll-c > span { transition: none; }
    }

    @media (max-width: 460px) {
      .buttons { flex-direction: column; width: 100%; }
      .btn { width: 100%; justify-content: center; }
      footer { position: static; margin-top: 8px; }
      body { justify-content: flex-start; padding-top: 64px; }
    }
  </style>

  <script>
    (function () {
      var fine = matchMedia('(hover: hover) and (pointer: fine)');
      var reduced = matchMedia('(prefers-reduced-motion: reduce)');

      // ---------- ROLL ----------
      if (fine.matches && !reduced.matches) {
        document.querySelectorAll('a.btn').forEach(function (btn) {
          var label = btn.querySelector('.btn-label');
          if (!label) return;
          var text = label.textContent.trim();
          label.textContent = '';
          label.setAttribute('aria-label', text);
          label.classList.add('roll');

          Array.from(text).forEach(function (ch, i) {
            var glyph = ch === ' ' ? '\u00A0' : ch;
            var cell = document.createElement('span');
            cell.className = 'roll-c';
            cell.style.setProperty('--i', i);

            var s1 = document.createElement('span');
            s1.textContent = glyph;
            var s2 = document.createElement('span');
            s2.textContent = glyph;

            cell.appendChild(s1);
            cell.appendChild(s2);
            label.appendChild(cell);
          });
        });
      }

      // ---------- MAGNETIC ----------
      if (!fine.matches || reduced.matches) return;

      var K = 260, C = 18, M = 0.6, STRENGTH = 0.3;
      var magnets = [];
      var last = 0, raf = 0;

      document.querySelectorAll('.btn').forEach(function (btn) {
        var m = { el: btn, x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0 };
        btn.classList.add('magnetic-live');
        btn.addEventListener('pointerenter', function (e) {
          if (e.pointerType === 'mouse') track(m, e);
        });
        btn.addEventListener('pointermove', function (e) {
          if (e.pointerType === 'mouse') track(m, e);
        });
        btn.addEventListener('pointerleave', function () {
          m.tx = 0;
          m.ty = 0;
        });
        magnets.push(m);
      });

      function track(m, e) {
        var r = m.el.getBoundingClientRect();
        m.tx = (e.clientX - (r.left - m.x) - r.width / 2) * STRENGTH;
        m.ty = (e.clientY - (r.top - m.y) - r.height / 2) * STRENGTH;
        if (!raf) {
          last = performance.now();
          raf = requestAnimationFrame(tick);
        }
      }

      function tick(t) {
        var dt = Math.min((t - last) / 1000, 1 / 30) || 1 / 60;
        last = t;
        var busy = false;

        magnets.forEach(function (m) {
          var slack = Math.abs(m.tx - m.x) + Math.abs(m.ty - m.y);
          var speed = Math.abs(m.vx) + Math.abs(m.vy);
          if (slack < 0.01 && speed < 0.01) {
            if (m.tx === 0 && m.ty === 0) {
              m.x = m.y = m.vx = m.vy = 0;
              m.el.style.transform = '';
            }
            return;
          }
          busy = true;
          m.vx += ((K * (m.tx - m.x) - C * m.vx) / M) * dt;
          m.vy += ((K * (m.ty - m.y) - C * m.vy) / M) * dt;
          m.x += m.vx * dt;
          m.y += m.vy * dt;
          m.el.style.transform = 'translate3d(' + m.x.toFixed(2) + 'px,' + m.y.toFixed(2) + 'px,0)';
        });

        raf = busy ? requestAnimationFrame(tick) : 0;
      }
    })();
  </script>
