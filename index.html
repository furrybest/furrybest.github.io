  <style>
    :root {
      --brand: #ea5846;
      --bg: #050505;
      --text: #ffffff;
      --muted: #888888;
      --border: rgba(255, 255, 255, 0.1);
      --card-bg: rgba(255, 255, 255, 0.03);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: "Onest", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 440px;
    }

    /* --- АВАТАРКА --- */
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      background-color: #111;
      transition: border-color 0.3s;
    }
    .avatar:hover {
      border-color: var(--brand);
    }

    /* --- ТЕКСТ --- */
    h1 { 
      font-size: 1.8rem; 
      font-weight: 700; 
      letter-spacing: -0.02em; 
      margin-bottom: 8px; 
    }
    
    .bio-text {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 320px;
      text-align: center;
    }

    /* --- СОЦСЕТИ --- */
    .socials {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 40px;
    }
    
    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      transition: all 0.3s var(--ease);
    }
    
    .social-btn svg {
      width: 24px; 
      height: 24px;
      fill: currentColor;
      transition: transform 0.3s var(--ease);
    }
    
    .social-btn:hover svg {
      transform: scale(1.1);
    }

    /* Кастомные цвета при наведении */
    .social-btn.gh:hover { color: #ffffff; border-color: #ffffff; background: rgba(255,255,255,0.1); }
    .social-btn.tg:hover { color: #24A1DE; border-color: #24A1DE; background: rgba(36, 161, 222, 0.1); }
    .social-btn.ds:hover { color: #5865F2; border-color: #5865F2; background: rgba(88, 101, 242, 0.1); }
    .social-btn.fp:hover { color: #2784CA; border-color: #2784CA; background: rgba(39, 132, 202, 0.1); }

    /* --- ПРОЕКТЫ --- */
    .projects-title {
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
      font-weight: 600;
      width: 100%;
      text-align: left;
      padding-left: 4px;
    }

    .projects-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .project-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 16px;
      text-decoration: none;
      color: var(--text);
      text-align: left;
      transition: all 0.3s var(--ease);
    }
    
    .project-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(234, 88, 70, 0.4);
      transform: translateX(4px);
    }
    
    .project-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--brand);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .project-info h3 { 
      font-size: 15px; 
      margin-bottom: 2px; 
      font-weight: 600; 
    }
    .project-info p { 
      font-size: 13px; 
      color: var(--muted); 
      line-height: 1.4; 
    }

    /* --- ПОДВАЛ --- */
    footer {
      margin-top: auto;
      padding-top: 50px;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
